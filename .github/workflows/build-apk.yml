name: Build APK

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:
    inputs:
      appName:
        description: App name
        default: StarTap
        required: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: cordova create app com.fourseven.startap "StarTap"

      - name: Copy HTML
        run: |
          cd app/www
          rm -rf css js img
          rm -f index.html
          if [ -f "../../manual/index.html" ]; then
            cp "../../manual/index.html" index.html
          else
            echo "<h1>Missing manual/index.html</h1>" > index.html
          fi
          test -f index.html

      - name: Build debug APK
        run: |
          cd app
          cordova platform add android
          cordova build android

      - name: Collect APK
        run: |
          mkdir -p output
          APK=$(find app/platforms/android -name "*.apk" | head -1)
          test -n "$APK"
          cp "$APK" output/StarTap.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StarTap
          path: output/*.apk
          retention-days: 7