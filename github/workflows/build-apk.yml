name: Build APK - ${{ github.event.client_payload.jobId }}

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    name: ${{ github.event.client_payload.jobId }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Decode project file
        env:
          PROJECT_BASE64: ${{ github.event.client_payload.projectBase64 }}
          PROJECT_NAME: ${{ github.event.client_payload.projectFileName }}
        run: |
          echo "$PROJECT_BASE64" | base64 -d > "$PROJECT_NAME"
          ls -la

      - name: Create Cordova project
        env:
          APP_NAME: ${{ github.event.client_payload.appName }}
          PACKAGE_NAME: ${{ github.event.client_payload.packageName }}
        run: |
          cordova create app $PACKAGE_NAME "$APP_NAME"

      - name: Prepare project files
        env:
          PROJECT_NAME: ${{ github.event.client_payload.projectFileName }}
        run: |
          cd app/www
          rm -f css/index.css js/index.js index.html
          if [[ "$PROJECT_NAME" == *.zip ]]; then
            unzip -o "../../$PROJECT_NAME" -d .
          else
            cp "../../$PROJECT_NAME" index.html
          fi
          ls -la

      - name: Add Android platform
        run: |
          cd app
          cordova platform add android

      - name: Build APK
        run: |
          cd app
          cordova build android --release -- --packageType=apk

      - name: Find and rename APK
        env:
          APP_NAME: ${{ github.event.client_payload.appName }}
        run: |
          find app -name "*.apk" -type f
          APK=$(find app -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then echo "No APK found!"; exit 1; fi
          mkdir -p output
          cp "$APK" "output/${APP_NAME}.apk"
          ls -la output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.jobId }}
          path: output/*.apk
          retention-days: 7