<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FS Taps</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;font-family:'Courier New',monospace;color:#c0c8d0;position:fixed;overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.04) 0%,transparent 60%),#0a0a0a}
.logo{width:85%;max-width:360px;margin-bottom:20px;animation:fadeIn 1s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.title{font-size:1.5rem;letter-spacing:10px;color:#fff;text-transform:uppercase;margin-bottom:8px;text-shadow:0 0 30px rgba(255,255,255,.3);font-weight:900}
.subtitle{font-size:.6rem;letter-spacing:5px;color:#66707a;margin-bottom:30px}
.score-box{display:flex;flex-direction:column;align-items:center;margin-bottom:20px}
.score{font-size:4rem;font-weight:900;color:#fff;text-shadow:0 0 40px rgba(255,255,255,.4);line-height:1;font-variant-numeric:tabular-nums;transition:transform .1s}
.score-label{font-size:.55rem;letter-spacing:4px;color:#66707a;margin-top:6px}
.tap-btn{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#2a2e34 0%,#0f1114 100%);border:2px solid rgba(255,255,255,.15);color:#fff;font-family:'Courier New',monospace;font-size:1rem;font-weight:900;letter-spacing:4px;cursor:pointer;transition:all .1s ease;box-shadow:0 0 40px rgba(255,255,255,.05),inset 0 0 30px rgba(255,255,255,.03);outline:none}
.tap-btn:active{transform:scale(.95);box-shadow:0 0 60px rgba(255,255,255,.15),inset 0 0 40px rgba(255,255,255,.08)}
.streak{margin-top:18px;font-size:.7rem;letter-spacing:3px;color:#4a545e}
.streak span{color:#ffd700;font-weight:900}
.reset{margin-top:14px;padding:10px 30px;background:transparent;border:1px solid rgba(255,255,255,.15);color:#66707a;font-family:'Courier New',monospace;font-size:.65rem;letter-spacing:4px;cursor:pointer;border-radius:4px;transition:all .3s;outline:none}
.reset:active{border-color:rgba(255,255,255,.4);color:#fff;transform:scale(.97)}
.footer{position:fixed;bottom:18px;font-size:.5rem;letter-spacing:4px;color:#2a3038;text-align:center;width:100%}
</style>
</head>
<body>
<img class="logo" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2MDAgMjAwIj4KPGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJzIiB4MT0iMCUiIHkxPSIwJSIgeDI9IjAlIiB5Mj0iMTAwJSI+PHN0b3Agb2Zmc2V0PSIwJSIgc3R5bGU9InN0b3AtY29sb3I6I2ZmZmZmZiIvPjxzdG9wIG9mZnNldD0iNTAlIiBzdHlsZT0ic3RvcC1jb2xvcjojYThhOGE4Ii8+PHN0b3Agb2Zmc2V0PSIxMDAlIiBzdHlsZT0ic3RvcC1jb2xvcjojNmI2YjZiIi8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+Cjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0iQXJpYWwgQmxhY2ssIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iNzAiIGZvbnQtd2VpZ2h0PSI5MDAiIGZpbGw9InVybCgjcykiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGRvbWluYW50LWJhc2VsaW5lPSJtaWRkbGUiIGxldHRlci1zcGFjaW5nPSI0Ij5GT1VSIFNFVkVOPC90ZXh0Pgo8L3N2Zz4=" alt="FOUR SEVEN">

<div class="title">FS TAPS</div>
<div class="subtitle">TAP · SCORE · WIN</div>

<div class="score-box">
<div class="score" id="score">0</div>
<div class="score-label">SCORE</div>
</div>

<button class="tap-btn" id="tapBtn">TAP</button>

<div class="streak">STREAK: <span id="streak">0</span></div>
<button class="reset" id="resetBtn">RESET</button>

<div class="footer">POWERED BY FOUR SEVEN</div>

<script>
(function(){
var score=0,streak=0,lastTap=0;
var scoreEl=document.getElementById('score');
var streakEl=document.getElementById('streak');
var tapBtn=document.getElementById('tapBtn');
var resetBtn=document.getElementById('resetBtn');

function vib(ms){if(navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}

function upd(){
scoreEl.textContent=score;
scoreEl.style.transform='scale(1.15)';
setTimeout(function(){scoreEl.style.transform='scale(1)'},100);
var now=Date.now();
if(now-lastTap<1500){streak++;if(streak%10===0)vib([30,30,30])}else{streak=1}
lastTap=now;streakEl.textContent=streak;
}

tapBtn.addEventListener('click',function(){score++;upd();vib(15)});
resetBtn.addEventListener('click',function(){if(score===0)return;score=0;streak=0;lastTap=0;scoreEl.textContent='0';streakEl.textContent='0';vib([50,30,50])});

document.addEventListener('dblclick',function(e){e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',function(e){e.preventDefault()});
document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});

if(screen.orientation&&screen.orientation.lock){
  screen.orientation.lock('portrait').catch(function(){});
}
})();
</script>
</body>
</html>
